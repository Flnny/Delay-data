experiment:
  name: "baseline_all_features"
  description: >
    All raw features, no SHAP selection, no HUIM.
    NOTE: trained under its legacy (non-comparable) settings via `overrides` below;
    the comparable reference arm is 01b_baseline_matched_training.

features:
  mode: "all"

# Legacy 01 training settings (differ from every other arm; kept only to document them)
overrides:
  training:
    phase1_val_mode: "internal"
    phase1_val_size: 0.5
    phase2_frac: 1.0
    val_frac: 1.0
    patience_phase2: 3
    batch_size: 4096
    num_workers: 2
