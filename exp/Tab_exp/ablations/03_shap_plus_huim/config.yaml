experiment:
  name: "shap_plus_huim"
  description: >
    Top-N SHAP features + top-K HUIM driver and protector patterns as binary features.
    This is the main proposed method.

features:
  mode: "shap_plus_huim"
  top_shap_n: 10
  top_drivers_n: 20
  top_protectors_n: 20
  # SHAP/HUIM files, relative to this arm dir. Primary: 2020 training days only.
  # Cross-year check: --set features.extraction_dir=../../shap_huim_extractions/01_2024_baseline/csvs
  extraction_dir: "../../shap_huim_extractions/02_2020_train/csvs"
