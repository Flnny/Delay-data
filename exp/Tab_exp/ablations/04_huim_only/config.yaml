experiment:
  name: "huim_only"
  description: >
    Only HUIM binary pattern columns — no original features at all.
    Tests whether mined combinatorial patterns alone can predict delay.

features:
  mode: "huim_only"
  top_drivers_n: 20
  top_protectors_n: 20
  # SHAP/HUIM files, relative to this arm dir. Primary: 2020 training days only.
  # Cross-year check: --set features.extraction_dir=../../shap_huim_extractions/01_2024_baseline/csvs
  extraction_dir: "../../shap_huim_extractions/02_2020_train/csvs"
