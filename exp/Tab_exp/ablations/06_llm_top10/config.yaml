experiment:
  name: "llm_top10"
  description: >
    Top-10 LLM-selected features only (LLM-Select / LLM-Score, local Ollama
    qwen2.5:7b, from ablations/05_baseline_100_data). No SHAP, no HUIM.
    Answers whether a 7B model ranking features from their NAMES alone picks a
    feature set as predictive as SHAP's.
    Note: at top-10 the data-free and data-informed prompt variants select the
    IDENTICAL set (they differ only in ranking), so this single arm covers both.
    The variants are separated at top-5 in 06_1 / 06_2.

features:
  mode: "llm_only"
  top_n: 10
  # Ranked Feature,LLM_Score CSV produced by ablations/05_baseline_100_data/run.py.
  importance_file: "../05_baseline_100_data/output/llm_feature_importance_datafree.csv"
