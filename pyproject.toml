[project]
name = "delay-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas>=2.0.3,<3.0.0",
    "pyyaml",
    "scikit-learn",
    "torch>=2.7.0",
    "mambular>=1.5.1",
    "shap>=0.49.1",
    "pami>=2026.1.19.1",
    "litlogger>=2026.4.16",
    "sentence-transformers>=5.6.1",
    "skrub>=0.10.0",
    "tabpfn>=8.1.0",
    "pyarrow>=25.0.0",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "xgboost>=3.4.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
